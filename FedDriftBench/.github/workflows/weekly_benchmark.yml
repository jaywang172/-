name: Weekly Benchmark Run

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8 hours max

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run benchmark
      run: |
        cd FedDriftBench
        python experiments/run_benchmark.py

    - name: Generate visualizations
      run: |
        cd FedDriftBench
        python experiments/visualize_results.py

    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: |
          FedDriftBench/results/benchmarks/*.json
          FedDriftBench/results/visualizations/*.png

    - name: Commit results to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add FedDriftBench/results/
        git commit -m "Weekly benchmark results - $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push || echo "No changes to push"
